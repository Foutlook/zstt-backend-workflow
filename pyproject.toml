[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zstt-cli"
version = "0.4.0"
description = "将 ZSTT Java 后端 Skills、规则和运行时安装到业务仓库"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ZSTT Team" }
]
dependencies = []

[project.scripts]
zstt = "zstt_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zstt_cli = [
  "resources/skills/*/*",
  "resources/skills/*/*/*",
  "resources/skills/*/*/*/*",
  "resources/skills/*/*/*/*/*",
  "resources/skills/*/*/*/*/*/*",
  "resources/rules/*",
  "resources/rules/*/*",
  "resources/runtime/*",
  "resources/templates/*/*"
]

[tool.setuptools.exclude-package-data]
zstt_cli = [
  "resources/**/__pycache__/*",
  "resources/**/*.pyc"
]
